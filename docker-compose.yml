version: '3.8'

services:
  backend:
    build: ./backend
    container_name: kioni-backend
    ports:
      - "8000:8000"
    environment:
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - CHROMA_PERSIST_DIR=/app/chroma_db
    volumes:
      - chroma_data:/app/chroma_db
      - model_cache:/root/.cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: kioni-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Optional: Add Redis for session management
  redis:
    image: redis:7-alpine
    container_name: kioni-redis
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  chroma_data:
  model_cache:
  redis_data: