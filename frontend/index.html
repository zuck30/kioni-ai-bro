<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/kioni-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="KIONI - Your Swahili-speaking AI Bro. Rafiki yako wa AI." />
    <meta name="theme-color" content="#050505" />
    

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <title>KIONI | AI Bro</title>
    
    <style>
      /* Critical CSS for loading state */
      body {
        margin: 0;
        background-color: #050505;
        color: #e5e7eb;
        font-family: 'Inter', sans-serif;
      }
      
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at center, #0f172a 0%, #050505 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      
      .kioni-loader {
        position: relative;
        width: 100px;
        height: 100px;
      }

      .kioni-loader::before,
      .kioni-loader::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: 2px solid transparent;
        border-top-color: #06b6d4;
        border-radius: 50%;
        animation: spin 1.5s linear infinite;
      }

      .kioni-loader::after {
        border-top-color: #3b82f6;
        animation-duration: 2s;
        transform: scale(0.8);
      }

      .loader-orb {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 20px;
        height: 20px;
        background: #06b6d4;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 20px #06b6d4;
        animation: pulse 1s ease-in-out infinite;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      @keyframes pulse {
        0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
        50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
      }

      .loading-text {
        margin-top: 40px;
        color: #06b6d4;
        font-size: 0.8rem;
        font-family: monospace;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        animation: textPulse 2s ease-in-out infinite;
      }
      
      @keyframes textPulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.8; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="loading-screen">
        <div class="kioni-loader">
          <div class="loader-orb"></div>
        </div>
        <div class="loading-text">System Initializing...</div>
      </div>
    </div>
    
    <script type="module" src="/src/main.tsx"></script>
    
    <script>
      window.addEventListener('load', () => {
        const loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen) {
          setTimeout(() => {
            loadingScreen.style.opacity = '0';
            setTimeout(() => {
              loadingScreen.remove();
            }, 500);
          }, 1000); // Give it a second to look cool
        }
      });
    </script>
  </body>
</html>
